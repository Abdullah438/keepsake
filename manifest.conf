# keepsake manifest
# Lines are paths relative to $HOME, or absolute (e.g. /etc/...).
# Absolute paths are stored under system/ and restored in place (sudo if needed).
# Groups: core apps gtk editor packages dev secrets extra
# Default backup groups: core apps gtk editor packages dev
# Opt-in extras: keepsake backup --secrets
# packages_exclude: glob patterns of package names to drop from the portable
# list on any distro/desktop (see [packages_exclude] below)

[core]
.zshrc
.p10k.zsh
.bashrc
.bash_profile
.nanorc
.gitconfig
.config/zsh
.config/git

[apps]
.config/fastfetch
.config/alacritty
.config/btop
.config/cava
.config/micro/settings.json
.config/micro/bindings.json
.config/micro/colorschemes
.config/fontconfig
.config/terminal-news
.config/systemd/user
.config/keepsake/manifest.conf
.config/gh/config.yml
.config/mimeapps.list
.config/fish/config.fish
.local/bin/system-age
.local/share/terminal-news

[gtk]
.config/gtk-3.0
.config/gtk-4.0
.gtkrc-2.0

[editor]
.config/Cursor/User/settings.json

[secrets]
.ssh
.config/gh/hosts.yml
.config/rclone/rclone.conf

[dev]
# Extra bind-mount / data dirs under $HOME (git trees are never copied).
# Dev/Python/myproject/data

[packages_exclude]
# Glob patterns matched against package names in the portable list — use
# this on any desktop/distro to drop packages you don't want reinstalled
# elsewhere (desktop-session packages, hardware-specific drivers, etc.).
# nvidia-*
# *-session

[extra]
# Add anything else you want to keep, one path per line.
# .config/zed
# .config/mpv
# /etc/udev/hwdb.d/71-g502-disable.hwdb
